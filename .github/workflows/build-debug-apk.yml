name: Собрать DERMUX RU APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-debug-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Забрать исходники
        uses: actions/checkout@v6
      - name: Установить Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Установить Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Настроить Android SDK
        uses: android-actions/setup-android@v4
      - name: Установить Android SDK Platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Собрать debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: DERMUX-RU-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
